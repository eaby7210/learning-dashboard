<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Roadmap — Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1420">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>%F0%9F%8E%AE</text></svg>">
</head>
<body>
  <main>
    <h1>Learning Roadmap — Dashboard</h1>
    <div class="sub" id="generated">loading…</div>

    <div class="today-card" id="today-card" hidden></div>

    <div class="top">
      <div class="card">
        <div class="label">Level</div>
        <div class="value level-value" id="level">—</div>
      </div>
      <div class="card" style="flex: 2;">
        <div class="label">Total XP</div>
        <div class="value" id="xp">—</div>
        <div class="xp-bar-wrap"><div class="xp-bar" id="xp-bar" style="width:0%"></div></div>
      </div>
      <div class="card">
        <div class="label">Streak</div>
        <div class="value streak-value" id="streak">—</div>
      </div>
    </div>

    <section>
      <h2>Habit — Don't Break the Chain</h2>
      <div class="heatmap-wrap">
        <div class="heatmap" id="heatmap"></div>
      </div>
    </section>

    <section>
      <h2>Progress Map</h2>
      <div class="map-grid" id="map"></div>
    </section>

    <section class="notif-test">
      <button id="test-notif-btn">🔔 Test Notification</button>
      <div class="notif-status" id="notif-status"></div>
    </section>

    <footer id="footer"></footer>
  </main>

  <script src="nav.js"></script>
  <script>
    renderNav("index.html");

    function render(data) {
      document.getElementById("generated").textContent = "Last generated: " + data.generated;
      document.getElementById("level").textContent = data.level;
      document.getElementById("xp").textContent = data.total_xp + " XP";
      document.getElementById("streak").textContent = data.streak.current + "d";

      const xpIntoLevel = data.total_xp % 500;
      document.getElementById("xp-bar").style.width = (xpIntoLevel / 500 * 100) + "%";

      const map = document.getElementById("map");
      map.innerHTML = "";
      for (const [subject, info] of Object.entries(data.subjects)) {
        const card = document.createElement("div");
        card.className = "subject-card" + (info.finished ? " finished" : "");
        card.style.setProperty("--subject-color", SUBJECT_COLOR[subject] || "var(--border)");
        const dots = Array.from({ length: info.max_phase }, (_, i) => {
          const filled = i < info.phase;
          const cls = info.finished ? "finished" : filled ? "filled" : "";
          return `<div class="phase-dot ${cls}"></div>`;
        }).join("");
        card.innerHTML = `
          <div class="subject-name">${subject} ${info.finished ? '<span class="check">✓</span>' : ""}</div>
          <div class="subject-phase">Phase ${info.phase} / ${info.max_phase} — ${info.status}</div>
          <div class="phase-track">${dots}</div>
        `;
        map.appendChild(card);
      }

      renderHeatmap(data.streak.active_dates);

      document.getElementById("footer").textContent =
        "Data: progress.json — refreshed via scripts/gamify.py, source of truth is SESSION-LOG.md.";
    }

    let lastActiveDates = [];

    // toISOString() converts to UTC — a local midnight Date in any timezone ahead
    // of UTC (e.g. IST, +5:30) rolls back to the previous day once converted. Build
    // the ISO string from local y/m/d components instead, everywhere "today" or a
    // calendar-grid date needs to become a plain YYYY-MM-DD string.
    function isoLocal(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function renderHeatmap(activeDates) {
      if (activeDates) lastActiveDates = activeDates;
      const active = new Set(lastActiveDates);
      const el = document.getElementById("heatmap");
      const wrap = el.parentElement;
      el.innerHTML = "";

      // Fill the available width: wider on desktop (more weeks of history), fewer
      // weeks on a narrow phone screen instead of a fixed count either way.
      const CELL = 11, GAP = 3;
      const weeksFit = Math.floor((wrap.clientWidth + GAP) / (CELL + GAP));
      const WEEKS = Math.max(8, Math.min(53, weeksFit));

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      // Start on the Sunday at or before (today - (WEEKS*7 - 1) days), so the grid
      // ends on today's own column.
      const start = new Date(today);
      start.setDate(start.getDate() - (WEEKS * 7 - 1));
      start.setDate(start.getDate() - start.getDay());

      for (let week = 0; week < WEEKS; week++) {
        const col = document.createElement("div");
        col.className = "heatmap-col";
        for (let day = 0; day < 7; day++) {
          const d = new Date(start);
          d.setDate(d.getDate() + week * 7 + day);
          const iso = isoLocal(d);
          const cell = document.createElement("div");
          const future = d > today;
          cell.className = "heatmap-cell" + (active.has(iso) ? " active" : "") + (future ? " future" : "");
          cell.title = iso + (active.has(iso) ? " — active" : "");
          col.appendChild(cell);
        }
        el.appendChild(col);
      }
    }

    const DAY_ICON = { weekday: "🎯", saturday: "🚀", sunday: "🧘" };

    // The deep-work block from the weekly schedule (10:45-13:30, every day type) —
    // used only to pick the urgency framing, not to gate anything.
    const SESSION_START = 10 * 60 + 45;
    const SESSION_END = 13 * 60 + 30;
    const DAY_ALMOST_OVER = 22 * 60;

    function timeOfDayMessage() {
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      if (nowMin < SESSION_START) {
        return "Upcoming session at 10:45 — remember to log on.";
      }
      if (nowMin < SESSION_END) {
        return "Session time — hope you've started! Don't forget to push your progress.";
      }
      if (nowMin < DAY_ALMOST_OVER) {
        return "Session window's passed — still plenty of day left, jump in when you can.";
      }
      return "Day's almost done and nothing logged yet — even a 2-minute rep keeps the streak alive.";
    }

    function renderToday(t, activeToday) {
      const card = document.getElementById("today-card");
      if (!t) { card.hidden = true; return; }
      card.hidden = false;

      const lines = [];

      if (activeToday) {
        lines.push(`<div class="today-task">✅ Already logged today — nice. See you tomorrow.</div>`);
      } else {
        if (t.never_miss_twice) {
          lines.push(`<div class="today-nudge">Streak's at 0 — just show up for the
            two-minute warm-up today. Protect the habit, not the output.</div>`);
        }
        lines.push(`<div class="today-nudge today-time">${timeOfDayMessage()}</div>`);
        if (t.day_type === "sunday") {
          lines.push(`<div class="today-task">Retrieval/review day — light material, ${t.primary} or whatever's freshest.</div>`);
        } else {
          lines.push(`<div class="today-task"><span class="today-label">Primary (${t.primary}):</span> ${t.primary_task || "no pending task found"}</div>`);
          if (t.secondary) {
            lines.push(`<div class="today-task"><span class="today-label">Secondary (${t.secondary}):</span> ${t.secondary_task || "no pending task found"}</div>`);
          }
        }
      }

      card.innerHTML = `
        <div class="today-header">${DAY_ICON[t.day_type] || "📌"} Today — ${t.date} (${t.day_type})</div>
        ${lines.join("")}
      `;
    }

    const DAY_TYPE_JS = { 0: "weekday", 1: "weekday", 2: "weekday", 3: "weekday",
                           4: "weekday", 5: "saturday", 6: "sunday" };

    // today.json's own date/day_type is a snapshot only regenerated at session end
    // (can be days stale) — always trust the browser's live clock for "what day is
    // it", never the snapshot's, or a stale Sunday keeps reporting "already logged
    // today" forever once Monday actually arrives.
    function liveToday() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return { date: isoLocal(d), day_type: DAY_TYPE_JS[d.getDay()] };
    }

    let lastToday = null;

    function refreshTodayCard() {
      if (!lastToday) return;
      const live = liveToday();
      const activeToday = lastActiveDates.includes(live.date);
      renderToday({ ...lastToday, date: live.date, day_type: live.day_type }, activeToday);
    }

    Promise.all([
      loadProgress(),
      fetch("today.json").then((r) => (r.ok ? r.json() : null)).catch(() => null),
    ])
      .then(([progress, today]) => {
        render(progress);
        lastToday = today;
        refreshTodayCard();
      })
      .catch((err) => {
        document.getElementById("generated").textContent = "Failed to load progress.json: " + err;
      });

    // The time-of-day framing (not the task/streak data) changes across the day
    // even with no new push, and midnight can roll over while the tab stays open —
    // re-render the whole card, live date included, every few minutes.
    setInterval(refreshTodayCard, 5 * 60 * 1000);

    // Fires a real local notification through the already-registered service
    // worker — confirms the phone/PWA notification pipeline works on this device
    // before wiring up the real ntfy.sh scheduled push.
    document.getElementById("test-notif-btn").addEventListener("click", async () => {
      const status = document.getElementById("notif-status");
      if (!("Notification" in window)) {
        status.textContent = "This browser doesn't support notifications.";
        return;
      }
      let perm = Notification.permission;
      if (perm === "default") {
        perm = await Notification.requestPermission();
      }
      if (perm !== "granted") {
        status.textContent = "Permission denied — enable notifications for this site in your browser/OS settings.";
        return;
      }
      if (!("serviceWorker" in navigator)) {
        status.textContent = "No service worker support — can't show a notification here.";
        return;
      }
      try {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification("Learning Roadmap", {
          body: lastToday
            ? `Test ping — today's primary is ${lastToday.primary}.`
            : "Test notification — this is what a real reminder will look like.",
          icon: "icons/icon-192.png",
          badge: "icons/icon-192.png",
        });
        status.textContent = "Sent — check your notification shade.";
      } catch (err) {
        status.textContent = "Failed to show notification: " + err;
      }
    });

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => renderHeatmap(), 150);
    });
  </script>
</body>
</html>
