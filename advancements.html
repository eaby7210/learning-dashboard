<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advancements — Learning Roadmap</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1420">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>%F0%9F%8E%AE</text></svg>">
</head>
<body>
  <main>
    <h1>Advancements</h1>
    <div class="sub">Task (square) → Goal (rounded) → Challenge (diamond, gold).
      Hover a node for how it's actually earned.</div>

    <div class="tab-strip" id="tabs"></div>
    <div id="lane-view"></div>
  </main>

  <script src="nav.js"></script>
  <script>
    renderNav("advancements.html");

    function nodeEl(n) {
      const el = document.createElement("div");
      el.className = `adv-node tier-${n.tier} ${n.earned ? "earned" : "locked"}`;
      el.setAttribute("data-tooltip", n.tooltip);
      el.innerHTML = `
        <div class="icon">${n.icon}</div>
        <div>
          <div class="title">${n.label}</div>
          <div class="detail">${n.flavor}</div>
        </div>
      `;
      return el;
    }

    // A plain sequence (each node has exactly one child) flows straight down with
    // no added indent — indentation is reserved for actual forks (2+ children), so
    // a long linear phase chain (e.g. JavaScript's Ph0-9, no cross-folder jump of
    // its own) doesn't stair-step sideways for no reason.
    function renderChain(startNode, childrenMap) {
      const col = document.createElement("div");
      col.className = "chain-col";
      let cursor = startNode;
      while (cursor) {
        col.appendChild(nodeEl(cursor));
        const kids = childrenMap[cursor.id] || [];
        if (kids.length === 0) {
          cursor = null;
        } else if (kids.length === 1) {
          const link = document.createElement("div");
          link.className = "chain-link";
          col.appendChild(link);
          cursor = kids[0];
        } else {
          const fork = document.createElement("div");
          fork.className = "tree-children";
          for (const k of kids) {
            const row = document.createElement("div");
            row.className = "tree-child-row";
            row.appendChild(renderChain(k, childrenMap));
            fork.appendChild(row);
          }
          col.appendChild(fork);
          cursor = null;
        }
      }
      return col;
    }

    function buildChildrenMap(nodes) {
      const map = {};
      for (const n of nodes) {
        if (n.parent) {
          (map[n.parent] = map[n.parent] || []).push(n);
        }
      }
      return map;
    }

    loadProgress().then((data) => {
      const lanes = { Streaks: data.advancements.filter((n) => n.subject === null) };
      for (const subject of Object.keys(data.subjects)) {
        lanes[subject] = data.advancements.filter((n) => n.subject === subject);
      }

      const tabsEl = document.getElementById("tabs");
      const laneView = document.getElementById("lane-view");
      const laneNames = Object.keys(lanes);

      function showLane(name) {
        [...tabsEl.children].forEach((t) => t.classList.toggle("active", t.dataset.lane === name));
        laneView.innerHTML = "";
        const nodes = lanes[name];
        const childrenMap = buildChildrenMap(nodes);
        const root = nodes.find((n) => !n.parent);
        if (!root) {
          laneView.innerHTML = '<div class="empty">Nothing here yet.</div>';
          return;
        }
        const tree = document.createElement("div");
        tree.className = "tree-root";
        tree.appendChild(renderChain(root, childrenMap));
        laneView.appendChild(tree);
      }

      for (const name of laneNames) {
        const tab = document.createElement("button");
        tab.className = "tab";
        tab.dataset.lane = name;
        const color = SUBJECT_COLOR[name] ? `style="--dot:${SUBJECT_COLOR[name]}"` : "";
        tab.innerHTML = name === "Streaks"
          ? "🔥 Streaks"
          : `<span class="tab-dot" ${color}></span>${name}`;
        tab.addEventListener("click", () => showLane(name));
        tabsEl.appendChild(tab);
      }

      showLane(laneNames[0]);
    });
  </script>
</body>
</html>
